name: M5 Signal Bot 2

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 4
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Pocket Option client
        run: |
          python -m pip install --upgrade pip
          git clone https://github.com/chema-creator/PocketOptionApi.git /tmp/PocketOptionApi
          cd /tmp/PocketOptionApi
          python -m pip install -e .

      - name: Run signal bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PO_SSID: ${{ secrets.PO_SSID }}
          SYMBOLS: EUR/USD,GBP/USD,USD/JPY,EURUSD_otc,GBPUSD_otc,USDJPY_otc,AUDUSD_otc
          MIN_SCORE: "5"
          COOLDOWN_BARS: "3"
        run: python bot.py

      - name: Save signal state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signal_state.json
          git diff --cached --quiet || git commit -m "Update signal state"
          git push
