name: M5 Signal Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Pocket Option client
        run: |
          git clone https://github.com/chema-creator/PocketOptionApi.git /tmp/PocketOptionApi
          python -m pip install -r /tmp/PocketOptionApi/requirements.txt
          python -m pip install -e /tmp/PocketOptionApi
          python -c "import pocketoptionapi; print(pocketoptionapi.__file__)"

      - name: Run signal bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PO_SSID: ${{ secrets.PO_SSID }}
          SYMBOLS: EUR/USD,GBP/USD,USD/JPY,AUD/USD,USD/CAD,USD/CHF,NZD/USD,EUR/JPY,GBP/JPY,EUR/GBP
          MIN_SCORE: "4"
          COOLDOWN_BARS: "1"
        run: python bot.py

      - name: Save signal state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signal_state.json
          git diff --cached --quiet || git commit -m "Update signal state"
          git push
